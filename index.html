  function normalize(text) {
    return String(text).replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
  }

  function copyPassword(text, btn) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
    btn.innerText = "تم نسخ الباسورد ✓";
    btn.style.background = "#0f766e";
    setTimeout(() => {
      btn.innerText = "نسخ الباسورد";
      btn.style.background = "#d97706";
    }, 2500);
  }

  function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(textArea);
  }

  function renderCards(matches) {
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    matches.forEach(s => {
      resultsDiv.innerHTML += `
        <div class="student-item">
          <div class="student-header">الطالبة: ${s.name}</div>
          <div class="row-data">
            <span><strong>المعرف (Login ID):</strong></span>
            <span class="data-val">${s.id}</span>
          </div>
          <div class="row-data">
            <span><strong>كلمة المرور:</strong> <span class="data-val">${s.pass}</span></span>
            <button type="button" class="copy-pass-btn" onclick="copyPassword('${s.pass}', this)">نسخ الباسورد</button>
          </div>

          <div class="steps-box">
            <strong>خطوات الدخول في 10 ثوانٍ (بدون رجوع هنا):</strong><br>
            1️⃣ احفظي رقم الـ <strong>ID</strong> المكون من 7 أرقام (أو خدي لقطة شاشة).<br>
            2️⃣ اضغطي على زر <strong>(نسخ الباسورد)</strong> البرتقالي.<br>
            3️⃣ اضغطي الزر الأخضر بالأسفل، اكتبي الـ 7 أرقام بيدك، واعملي <strong>لصق (Paste)</strong> للباسورد!
          </div>

          <a href="${SPRIX_PORTAL_URL}" target="_blank" rel="noopener" class="platform-btn">
            الدخول إلى منصة SPRIX / TOFAS الآن ↗
          </a>
        </div>
      `;
    });
  }

  function liveSearch() {
    const rawInput = document.getElementById("searchInput").value;
    const query = normalize(rawInput);
    const resultsDiv = document.getElementById("results");

    if (!query) {
      resultsDiv.innerHTML = "";
      try { localStorage.removeItem("lastQuery"); } catch (e) {}
      return;
    }

    const isNumeric = /^\d+$/.test(query);

    if (isNumeric) {
      if (query.length < 4) {
        resultsDiv.innerHTML = '<div class="hint-msg">استكملي كتابة باقي أرقام كود الطالبة...</div>';
        return;
      }
    } else {
      const nameParts = query.split(' ');
      if (nameParts.length < 2 || nameParts[1].length < 2) {
        resultsDiv.innerHTML = '<div class="hint-msg">يرجى كتابة اسمك الأول متبوعاً بمسافة وحرفين على الأقل من اسم الأب.</div>';
        return;
      }
    }

    const matches = tofasStudents.filter(s => 
      isNumeric ? normalize(s.code).includes(query) : normalize(s.name).includes(query)
    );

    if (matches.length === 0) {
      resultsDiv.innerHTML = '<div class="error">لا توجد طالبة بهذه البيانات في قوائم الصف الأول الثانوي.</div>';
      return;
    }

    try { localStorage.setItem("lastQuery", rawInput); } catch (e) {}
    renderCards(matches);
  }

  window.onload = function() {
    try {
      const saved = localStorage.getItem("lastQuery");
      if (saved) {
        document.getElementById("searchInput").value = saved;
        liveSearch();
      }
    } catch (e) {}
  };
